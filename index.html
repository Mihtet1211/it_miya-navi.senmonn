    <script>
        // ホームの背景写真を4秒ごとに切り替える
        const hero = document.querySelector(".hero");
        const photos = ["image/fuji.jpg", "image/fuji5.jpg"];
        let photoIndex = 0;

        // 写真を先に読み込む
        photos.forEach((src) => {
            const image = new Image();
            image.src = src;
        });

        setInterval(() => {
            photoIndex = (photoIndex + 1) % photos.length;
            hero.style.backgroundImage =
                `linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url("${photos[photoIndex]}")`;
        }, 4000);
